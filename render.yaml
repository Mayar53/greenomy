# render.yaml — Render Blueprint for the Greenomy API.
#
# Deploy: Render Dashboard -> New + -> Blueprint -> pick this repo. Render reads
# this file from the branch it deploys (main) and creates two resources:
#
#   greenomy-db    managed PostgreSQL (the API's DB_DRIVER=pg database)
#   greenomy-api   the Express API in backend/, reachable at
#                  https://greenomy-api.onrender.com
#
# The static frontend is NOT deployed here — it is a plain HTML/CSS/JS site on
# Netlify (see netlify.toml), which proxies /api/* to greenomy-api.onrender.com
# server-side. Keep the service name "greenomy-api": that is the host Netlify
# forwards to. Anything with `sync: false` is a value you fill in once in the
# Render dashboard on the first deploy.

databases:
  - name: greenomy-db
    databaseName: greenomy
    user: greenomy
    plan: free

services:
  - type: web
    name: greenomy-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    # migrate and seed are both idempotent, so running them on every boot is safe
    # and means a brand-new database is usable with no manual shell step. The
    # seed step needs ADMIN_SEED_EMAIL / ADMIN_SEED_PASSWORD below.
    startCommand: npm run db:setup && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # --- runtime ---
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.11.0

      # --- database ---
      - key: DB_DRIVER
        value: pg
      - key: DATABASE_URL
        fromDatabase:
          name: greenomy-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"

      # --- auth ---
      # Production refuses to start without a real secret; Render generates one.
      - key: JWT_SECRET
        generateValue: true

      # --- the owner account (npm run seed creates it) ---
      # REQUIRED: in production the seed creates no owner at all when this is
      # blank (database/seed.js logs a warning and skips it), leaving the site
      # with no admin account. Set it here, or the first deploy goes live with
      # a completely empty users table.
      - key: ADMIN_SEED_EMAIL
        value: mayarraws@gmail.com
      - key: ADMIN_SEED_PASSWORD
        sync: false

      # --- the public site address (your Netlify URL) ---
      # APP_BASE_URL is used to build links inside emails, so it must be the
      # address a member actually opens. CORS_ORIGIN is the browser origin
      # allowed to call the API directly (the Netlify proxy is server-side and
      # needs no entry). Set CORS_ORIGIN to your site URL, e.g.
      # https://greenomy.netlify.app
      - key: APP_BASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false

      # --- email: password resets, notifications and care reminders ---
      # One mailbox for everything the app sends. Gmail needs an APP PASSWORD,
      # not the account password (see .env.example).
      - key: MAIL_PROVIDER
        value: smtp
      - key: MAIL_FROM
        value: Greenomy <Greenomyofficial@gmail.com>
      - key: MAIL_SMTP_HOST
        value: smtp.gmail.com
      - key: MAIL_SMTP_PORT
        value: "465"
      - key: MAIL_SMTP_SECURE
        value: "true"
      - key: MAIL_SMTP_USER
        sync: false
      - key: MAIL_SMTP_PASS
        sync: false
      - key: MAIL_EMAIL_NOTIFICATIONS
        value: "true"

      # --- Telegram contact bot ---
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Must be the SAME value as TELEGRAM_WEBHOOK_SECRET in backend/.env. The
      # webhook URL is built from it, and Telegram's registration has to match
      # what this service checks — a generated value here would make
      # `npm run telegram -- webhook` register a URL that always 401s.
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_URL
        value: https://t.me/Greenomy_bot
      - key: TELEGRAM_CHANNEL_URL
        value: https://t.me/Greenomy_official

      # --- AI (optional) ---
      # Leave AI_API_KEY empty (blank) to run fully offline: no AI features and
      # heuristic photo scoring. These values use the Gemini compatible
      # endpoint — change them in the dashboard for another provider.
      - key: AI_API_KEY
        sync: false
      - key: AI_API_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      # gemini-3.5-flash answers immediately; gemini-3.6-flash is frequently
      # shedding load (503 "high demand") and took 19s to say so, so it is a
      # stand-in rather than the default. The client retries, then walks this
      # list in order.
      - key: AI_MODEL
        value: gemini-3.5-flash
      - key: AI_FALLBACK_MODELS
        value: gemini-3.6-flash,gemini-flash-latest
      - key: AI_TIMEOUT_MS
        value: "120000"

      # --- defaults that need no network or account ---
      - key: WEATHER_PROVIDER
        value: offline
      - key: PUSH_PROVIDER
        value: console

# NOTE — free-plan limitations, not oversights:
#   * No persistent disk on a free web service, so the original verification
#     images under backend/uploads/ are lost on each deploy/restart. The
#     database still holds each row's preview, so member history renders; a
#     Render disk (paid) or object storage is what makes originals durable.
#   * Render's free PostgreSQL instance expires after 90 days unless upgraded.
