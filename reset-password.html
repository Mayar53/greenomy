<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title data-i18n="auth.resetTitle">Choose a new password — Greenomy</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&family=Noto+Sans+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="stylesheet" href="responsive.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand"><img class="brand-mark" src="logo-mark.png" alt="" /> <span class="brand-name">Greenomy</span></a>
      <div class="header-actions" style="margin-inline-start: auto;">
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang-option="en" aria-pressed="true">EN</button>
          <button type="button" data-lang-option="ar" aria-pressed="false">AR</button>
          <button type="button" data-lang-option="ku" aria-pressed="false">KU</button>
        </div>
      </div>
    </div>
  </header>

  <main class="auth-shell">
    <div class="auth-card card">
      <div class="auth-header">
        <img class="brand-mark" src="logo-mark.png" alt="" style="margin: 0 auto 14px;" />
        <h1 data-i18n="auth.resetTitle">Choose a new password</h1>
        <p data-i18n="auth.resetLead">Pick a new password for your Greenomy account.</p>
      </div>

      <form data-reset-form novalidate>
        <div class="form-field">
          <label for="newPassword" data-i18n="profile.newPassword">New password</label>
          <div class="password-field">
            <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" required />
            <button type="button" class="password-toggle" data-i18n="auth.showPassword">Show</button>
          </div>
          <span class="field-error" role="alert"></span>
        </div>

        <div class="form-field">
          <label for="confirmPassword" data-i18n="auth.confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required />
          <span class="field-error" role="alert"></span>
        </div>

        <p class="form-note" data-i18n="auth.passwordNote">At least 8 characters, with a letter and a number.</p>

        <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.resetButton">Set new password</button>
        <div class="form-status" data-form-status role="status" aria-live="polite"></div>
      </form>

      <div data-reset-done hidden>
        <p class="form-status is-success" data-i18n="auth.resetDone">Password updated — you can log in now.</p>
        <a href="login.html" class="btn btn-primary btn-block" data-i18n="auth.backToLogin">Back to log in</a>
      </div>

      <p class="auth-switch">
        <a href="login.html" class="btn-ghost" data-i18n="auth.backToLogin">Back to log in</a>
      </p>
    </div>
  </main>

  <script type="module" src="main.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
