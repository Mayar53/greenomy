name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # The suite runs against an in-process PGlite database, so no services
      # (Postgres, network) are needed here.
      - run: npm test

  frontend:
    name: Frontend integrity tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No build step and no dependencies: the tests read the static files.
      - run: npm test
