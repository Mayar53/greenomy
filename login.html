<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title data-i18n="meta.loginTitle">Log In — Greenomy</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="stylesheet" href="responsive.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand"><img class="brand-mark" src="logo-mark.png" alt="" /> <span class="brand-name">Greenomy</span></a>
      <div class="header-actions" style="margin-inline-start: auto;">
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang-option="en" aria-pressed="true">EN</button>
          <button type="button" data-lang-option="ar" aria-pressed="false">AR</button>
          <button type="button" data-lang-option="ku" aria-pressed="false">KU</button>
        </div>
      </div>
    </div>
  </header>

  <main class="auth-shell">
    <div class="auth-card card">
      <div class="auth-header">
        <img class="brand-mark" src="logo-mark.png" alt="" style="margin: 0 auto 14px;" />
        <h1 data-i18n="auth.loginTitle">Welcome back</h1>
        <p data-i18n="auth.loginLead">Log in to keep growing with Greenomy.</p>
      </div>

      <form data-login-form novalidate>
        <div class="form-field">
          <label for="email" data-i18n="contact.email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
          <span class="field-error" role="alert"></span>
        </div>

        <div class="form-field">
          <label for="password" data-i18n="auth.password">Password</label>
          <div class="password-field">
            <input type="password" id="password" name="password" autocomplete="current-password" required />
            <button type="button" class="password-toggle" data-i18n="auth.showPassword">Show</button>
          </div>
          <span class="field-error" role="alert"></span>
        </div>

        <div class="auth-meta-row">
          <label class="checkbox-row">
            <input type="checkbox" name="remember" checked />
            <span data-i18n="auth.rememberMe">Remember me</span>
          </label>
          <a href="forgot-password.html" class="btn-ghost" data-i18n="auth.forgotPassword">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.loginButton">Log In</button>
        <div class="form-status" data-form-status role="status" aria-live="polite"></div>
      </form>

      <p class="auth-switch"><span data-i18n="auth.loginSwitch">Don't have an account?</span> <a href="signup.html" class="btn-ghost" data-i18n="nav.join">Join Greenomy</a></p>
    </div>
  </main>

  <script type="module" src="main.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
