<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title data-i18n="adminTab.partners">Partners — Greenomy</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&family=Noto+Sans+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="responsive.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand"><img class="brand-mark" src="logo-mark.png" alt="" /> <span class="brand-name">Greenomy</span></a>
      <div class="header-actions" style="margin-inline-start: auto;">
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang-option="en" aria-pressed="true">EN</button>
          <button type="button" data-lang-option="ar" aria-pressed="false">AR</button>
          <button type="button" data-lang-option="ku" aria-pressed="false">KU</button>
        </div>
        <a href="wallet.html" class="btn btn-ghost" data-i18n="nav.wallet">Wallet</a>
      </div>
    </div>
  </header>

  <main>
    <section class="section-tight">
      <div class="container">
        <nav class="admin-nav" aria-label="Admin sections">
          <a href="admin.html" data-i18n="adminTab.queue">Queue</a>
          <a href="admin-users.html" data-i18n="adminTab.users">Users</a>
          <a href="admin-partners.html" data-i18n="adminTab.partners" aria-current="page">Partners</a>
          <a href="admin-rewards.html" data-i18n="adminTab.rewards">Rewards</a>
          <a href="admin-content.html" data-i18n="adminTab.content">Content</a>
          <a href="admin-analytics.html" data-i18n="adminTab.analytics">Analytics</a>
          <a href="profile.html" data-i18n="nav.profile">Profile</a>
        </nav>

        <div class="section-head">
          <span class="eyebrow" data-i18n="admin.eyebrow">Admin</span>
          <h1 class="heading-lg" data-i18n="adminTab.partners">Partners</h1>
          <p class="section-lead" data-i18n="admin.partnersLead">Partner businesses and whether they are active.</p>
        </div>

        <div class="empty-state" data-admin-denied hidden>
          <span class="icon-slot" aria-hidden="true" data-icon="lock"></span><span data-i18n="admin.notAuthorized">You don't have admin access to this page.</span>
        </div>

        <div data-admin-host>
          <form class="admin-form" data-partner-form novalidate>
            <div class="form-field">
              <label for="partner-name" data-i18n="admin.partnerName">Partner name</label>
              <input type="text" id="partner-name" name="name" required />
            </div>
            <div class="form-field">
              <label for="partner-website" data-i18n="admin.website">Website</label>
              <input type="url" id="partner-website" name="website" placeholder="https://" />
            </div>
            <div class="form-field">
              <label for="partner-contact" data-i18n="admin.contactEmail">Contact email</label>
              <input type="email" id="partner-contact" name="contactEmail" />
            </div>
            <div class="form-field">
              <label for="partner-logo" data-i18n="admin.logoUrl">Logo URL</label>
              <input type="url" id="partner-logo" name="logoUrl" placeholder="https://" />
            </div>
            <div class="form-field admin-form-wide">
              <label for="partner-description" data-i18n="admin.description">Description</label>
              <textarea id="partner-description" name="description" rows="2"></textarea>
            </div>
            <div>
              <button type="submit" class="btn btn-primary" data-i18n="admin.create">Create</button>
              <button type="button" class="btn btn-secondary" data-cancel-edit data-i18n="admin.cancel" hidden>Cancel</button>
            </div>
            <div class="form-status admin-form-wide" data-form-status role="status" aria-live="polite"></div>
          </form>

          <div data-admin-partners></div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="main.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
