<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E" />
  <title data-i18n="meta.onboardingTitle">Welcome to Greenomy</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="stylesheet" href="responsive.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand"><span class="brand-mark" aria-hidden="true">🌱</span> Greenomy</a>
    </div>
  </header>

  <main class="wizard-shell">
    <div class="wizard-progress" aria-hidden="true">
      <span class="step-dot is-active"></span>
      <span class="step-dot"></span>
      <span class="step-dot"></span>
    </div>

    <div class="card wizard-card text-center">
      <div class="icon-badge" style="margin: 0 auto 18px;" aria-hidden="true">🌱</div>
      <h1 data-i18n="wizard.welcomeTitle">Welcome to Greenomy!</h1>
      <p class="section-lead" style="margin: 0 auto 28px;" data-i18n="wizard.welcomeLead">
        Let's set up your green space. In the next couple of minutes we'll get to know
        your gardening style and help you plant your very first seed.
      </p>
      <a href="eco-profile.html" class="btn btn-primary" data-i18n="wizard.getStarted">Get Started</a>
    </div>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
